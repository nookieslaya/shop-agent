services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: shop_agent
      POSTGRES_USER: shop_agent
      POSTGRES_PASSWORD: shop_agent_dev
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - shop_agent_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop_agent -d shop_agent"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ["tools"]
    environment:
      DATABASE_URL: postgresql://shop_agent:shop_agent_dev@postgres:5432/shop_agent
      NORTBERG_FEED_URL: ${NORTBERG_FEED_URL:-https://nortberg.pl/xml,google,32dycf1j4906.xml}
      ENRICH_LIMIT: ${ENRICH_LIMIT:-0}
      SCRAPE_CONCURRENCY: ${SCRAPE_CONCURRENCY:-2}
      REQUEST_DELAY_MS: ${REQUEST_DELAY_MS:-400}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_INTENT_MODEL: ${OPENAI_INTENT_MODEL:-gpt-5-nano}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  shop_agent_postgres:
