services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: shop_agent
      POSTGRES_USER: shop_agent
      POSTGRES_PASSWORD: shop_agent_dev
    ports:
      - "5432:5432"
    volumes:
      - shop_agent_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop_agent -d shop_agent"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  shop_agent_postgres:
